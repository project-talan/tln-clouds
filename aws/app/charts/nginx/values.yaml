controller:
  service:
    annotations:
      #old
      #service.beta.kubernetes.io/aws-load-balancer-type: nlb

      #new
        # 1. Enabling the new controller
      service.beta.kubernetes.io/aws-load-balancer-class: "service.k8s.aws"

        # 2. Specifying that this is an external NLB
      service.beta.kubernetes.io/aws-load-balancer-type: "external"

        # 3. Selecting the operation mode (this is the specific 'switch' for the NLB)
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"

        # 4. Making it accessible from the internet
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        # Enables cross-zone load balancing
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
        #change health check
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold: "5"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "30"
       #alow 404
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-success-codes: "200,404"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/"
      #another part
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
      service.beta.kubernetes.io/aws-load-balancer-alpn-policy: HTTP2Preferred
      service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06  # TLS 1.3 + 1.2 only (https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html)
    targetPorts:
      https: http
  config:
    use-proxy-protocol: "false"
    use-forwarded-headers: "true"
    use-http2: "true"
    enable-access-log-for-default-backend: "true"
    enable-real-ip: "true"
    use-gzip: "true"
    gzip-level: 6
    enable-brotli: "true"
    brotli-level: 5
    server-tokens: "false"
    ssl-redirect: "true"
    ssl-ciphers: EECDH+AESGCM:EDH+AESGCM:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305
    ssl-protocols: TLSv1.2 TLSv1.3
    limit-connections: "20"
    limit-rpm: "50"
